[tool.poetry]
name = "crypto-research-agent"
version = "0.1.0"
description = "An AI agent for cryptocurrency research with citations."
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

packages = [
    { include = "agents", from="." },
    { include = "backend", from="." }
]


package-mode = false

[tool.poetry.dependencies]
python = "^3.10"  # 或更高版本, 建議 3.10+
fastapi = "^0.115.6"
python-dotenv = "^1.0.0"
langchain-core = "^0.1.43"
google-genai = "^0.3.0"
aiohttp = "^3.9.1"
beautifulsoup4 = "^4.12.3"
pydantic = "^2.6.4"  # Pydantic v2
jinja2 = "^3.1.3"
pydantic-ai = {extras = ["vertexai"], version = "^0.0.30"}
motor = "^3.7.0"
apscheduler = "^3.11.0"
uvicorn = "^0.34.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"        # 測試相關
pytest-asyncio = "^0.25.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"